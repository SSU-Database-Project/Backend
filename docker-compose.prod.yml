# 서버(AWS EC2) 배포용 덧씌우기 파일. docker-compose.yml 위에 겹쳐서 쓴다 → README 7장.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
#
# 로컬과 다른 점
#  - 비밀값(JWT 키, DB·관리자 비밀번호)을 .env 에 꼭 넣어야 한다. 비어 있으면 실행 자체가 거부된다 (${이름:?메시지}).
#    → 개발용 기본 비밀번호로 서버가 뜨는 일을 막는다.
#  - DB 포트를 호스트에 아예 열지 않는다. 앱 컨테이너만 내부 네트워크로 접속한다.
#  - 앱은 80 번 포트(HTTP 기본)로 연다.
#  - 서버가 재부팅되거나 컨테이너가 죽으면 자동으로 다시 시작한다.
# ("!reset" 은 docker-compose.yml 의 값을 지우고, "!override" 는 새 값으로 바꾼다. Docker Compose 2.24 이상 필요)

services:
  db:
    restart: unless-stopped
    ports: !reset []
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 에 MYSQL_ROOT_PASSWORD 를 설정하세요}
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}

  app:
    restart: unless-stopped
    ports: !override
      - "80:8080"
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET 을 설정하세요 (openssl rand -base64 48)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?.env 에 ADMIN_EMAIL 을 설정하세요}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?.env 에 ADMIN_PASSWORD 를 설정하세요}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?.env 에 CORS_ALLOWED_ORIGINS(프론트 주소)를 설정하세요}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
