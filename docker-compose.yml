# 이 프로젝트 전용 MySQL(+ 선택적으로 앱) 컨테이너
#
#   docker compose up -d                 # DB만 실행 (앱은 IDE/gradlew 로 실행할 때)
#   docker compose --profile app up -d   # DB + 앱 같이 실행 (로컬 시연)
#   docker compose down                  # 중지 (데이터는 볼륨에 남음)
#   docker compose down -v               # 중지 + 데이터까지 삭제 (DB 초기화)
#
# 서버(AWS) 배포는 docker-compose.prod.yml 을 덧씌운다 → README 7장.
#
# 호스트 포트 3308 을 쓴다. 이 PC의 3306(MariaDB), 3307(MySQL 설치본)과 겹치지 않게 하기 위해서다.
# 127.0.0.1 에만 열어서 같은 PC 에서만 접속할 수 있다 (외부에서 DB 에 직접 붙지 못하게).
#
# 아래 ${이름:-기본값} 은 .env 파일이나 환경변수로 바꿀 수 있다. 로컬에서는 기본값 그대로 쓰면 된다.

name: shop

services:
  db:
    image: mysql:8.0
    container_name: shop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: shop                          # 최초 실행 시 shop DB 생성
      MYSQL_USER: shop                              # shop 계정 생성 + shop DB 권한 부여
      MYSQL_PASSWORD: ${DB_PASSWORD:-shop1234}      # 볼륨이 비어 있을 때(최초 실행)만 적용된다
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - shop-mysql-data:/var/lib/mysql
      # 최초 실행(볼륨이 비어 있을 때)에만 실행: shop_test DB 생성 + 권한
      - ./scripts/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP 로 확인한다: 최초 실행 때 MySQL 은 초기화용 임시 서버(TCP 를 받지 않음)를 먼저 띄우는데,
      # 소켓으로 확인하면 그 임시 서버에서 통과해 앱이 너무 일찍 접속했다가 실패한다.
      # 컨테이너 안의 환경변수를 쓴다 ($$ = compose 가 치환하지 않고 그대로 넘김)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    profiles: ["app"]
    build: .
    container_name: shop-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 컨테이너끼리는 서비스 이름(db)과 컨테이너 내부 포트(3306)로 접속한다
      DB_URL: jdbc:mysql://db:3306/shop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: shop
      DB_PASSWORD: ${DB_PASSWORD:-shop1234}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}   # local = 시연 데이터 포함, prod = 미포함
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-key-change-me-0123456789abcdef}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shop.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}  # 여러 개면 쉼표로 구분
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    volumes:
      # 업로드한 상품·브랜드 이미지. 볼륨에 두어야 앱을 다시 빌드·배포해도 사라지지 않는다
      - shop-uploads:/app/uploads

volumes:
  shop-mysql-data:
  shop-uploads:
